<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Formatter & Validator</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --popover: 0 0% 100%;
      --popover-foreground: 240 10% 3.9%;
      --primary: 239 84% 67%;
      --primary-foreground: 0 0% 100%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 239 84% 67%;
      --radius: 0.5rem;
    }

    .dark {
      --background: 240 10% 3.9%;
      --foreground: 0 0% 98%;
      --card: 240 10% 3.9%;
      --card-foreground: 0 0% 98%;
      --popover: 240 10% 3.9%;
      --popover-foreground: 0 0% 98%;
      --primary: 239 84% 67%;
      --primary-foreground: 0 0% 100%;
      --secondary: 240 3.7% 15.9%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 3.7% 15.9%;
      --muted-foreground: 240 5% 64.9%;
      --accent: 240 3.7% 15.9%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 62.8% 30.6%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 3.7% 15.9%;
      --input: 240 3.7% 15.9%;
      --ring: 239 84% 67%;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid hsl(var(--border));
      background: hsl(var(--card));
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-group img {
      width: 2rem;
      height: 2rem;
      border-radius: 9999px;
      object-fit: cover;
      border: 1px solid hsl(var(--border));
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .logo-group h1 {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      color: hsl(var(--foreground));
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .github-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s, background 0.15s;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      border-radius: calc(var(--radius) - 2px);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      cursor: pointer;
      text-decoration: none;
    }

    .github-btn:hover {
      background: hsl(var(--muted));
    }

    .github-btn:focus-visible {
      outline: none;
      ring: 2px solid hsl(var(--ring));
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring));
    }

    .github-btn svg {
      width: 1rem;
      height: 1rem;
    }

    .github-btn .btn-text {
      display: inline;
    }

    @media (max-width: 640px) {
      .github-btn .btn-text {
        display: none;
      }
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.25rem;
      height: 2.25rem;
      border: 1px solid hsl(var(--border));
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      transition: background 0.15s;
    }

    .theme-toggle:hover {
      background: hsl(var(--muted));
    }

    .theme-toggle svg {
      width: 1rem;
      height: 1rem;
    }

    main {
      max-width: 56rem;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .hero {
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero h2 {
      font-size: 1.875rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: hsl(var(--muted-foreground));
      font-size: 1rem;
    }

    .editor-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .editor-container {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      overflow: hidden;
      background: hsl(var(--card));
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.625rem 1rem;
      border-bottom: 1px solid hsl(var(--border));
      background: hsl(var(--muted));
    }

    .panel-header span {
      font-size: 0.8125rem;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      min-height: 24rem;
      padding: 1rem;
      border: none;
      background: hsl(var(--card));
      color: hsl(var(--foreground));
      font-family: 'SF Mono', 'Fira Code', 'Fira Mono', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    textarea::placeholder {
      color: hsl(var(--muted-foreground));
    }

    textarea:focus {
      box-shadow: inset 0 0 0 2px hsl(var(--ring));
    }

    #output {
      background: hsl(var(--muted));
      cursor: default;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: hsl(var(--secondary));
      color: hsl(var(--secondary-foreground));
      border-color: hsl(var(--border));
    }

    .btn-secondary:hover {
      background: hsl(var(--accent));
    }

    .btn-destructive {
      background: hsl(var(--destructive));
      color: hsl(var(--destructive-foreground));
    }

    .btn-destructive:hover {
      opacity: 0.9;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .status-success {
      background: hsl(142 76% 96%);
      color: hsl(142 76% 36%);
      border: 1px solid hsl(142 76% 86%);
    }

    .dark .status-success {
      background: hsl(142 76% 12%);
      color: hsl(142 76% 64%);
      border-color: hsl(142 76% 22%);
    }

    .status-error {
      background: hsl(0 84% 96%);
      color: hsl(0 84% 46%);
      border: 1px solid hsl(0 84% 86%);
    }

    .dark .status-error {
      background: hsl(0 62% 16%);
      color: hsl(0 84% 64%);
      border-color: hsl(0 62% 26%);
    }

    .status-info {
      background: hsl(var(--muted));
      color: hsl(var(--muted-foreground));
      border: 1px solid hsl(var(--border));
    }

    .status-dot {
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 9999px;
      flex-shrink: 0;
    }

    .status-success .status-dot { background: hsl(142 76% 46%); }
    .status-error .status-dot { background: hsl(0 84% 56%); }
    .status-info .status-dot { background: hsl(var(--muted-foreground)); }

    footer {
      text-align: center;
      padding: 2rem 1.5rem;
      border-top: 1px solid hsl(var(--border));
      color: hsl(var(--muted-foreground));
      font-size: 0.8125rem;
    }

    footer a {
      color: hsl(var(--primary));
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-group">
      <img src="/logo.png" alt="Logo" />
      <h1>JSON Formatter</h1>
    </div>
    <div class="header-actions">
      <a href="https://github.com/parithosh-varma/json-formatter-validator" target="_blank" rel="noopener noreferrer" class="github-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        <span class="btn-text">GitHub</span>
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="hero">
      <h2>Format, Validate & Minify</h2>
      <p>Paste your JSON, get instant formatting, validation, and minification.</p>
    </div>

    <div id="status"></div>

    <div class="actions">
      <button class="btn btn-primary" onclick="formatJSON()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
        Format
      </button>
      <button class="btn btn-secondary" onclick="minifyJSON()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        Minify
      </button>
      <button class="btn btn-secondary" onclick="validateJSON()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        Validate
      </button>
      <button class="btn btn-secondary" onclick="copyOutput()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        Copy
      </button>
      <button class="btn btn-destructive" onclick="clearAll()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        Clear
      </button>
    </div>

    <div class="editor-container">
      <div class="panel">
        <div class="panel-header">
          <span>Input</span>
        </div>
        <textarea id="input" placeholder='Paste your JSON here...\n\nExample:\n{\n  "name": "John",\n  "age": 30\n}'></textarea>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span>Output</span>
        </div>
        <textarea id="output" readonly placeholder="Formatted JSON will appear here..."></textarea>
      </div>
    </div>
  </main>

  <footer>
    <p>Built by <a href="https://github.com/parithosh-varma" target="_blank" rel="noopener noreferrer">Parithosh Varma</a></p>
  </footer>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function setStatus(type, message) {
      const classes = { success: 'status-success', error: 'status-error', info: 'status-info' };
      status.innerHTML = `<div class="status ${classes[type]}"><span class="status-dot"></span>${message}</div>`;
    }

    function clearStatus() {
      status.innerHTML = '';
    }

    function formatJSON() {
      clearStatus();
      const raw = input.value.trim();
      if (!raw) return setStatus('error', 'Input is empty. Paste some JSON first.');
      try {
        const parsed = JSON.parse(raw);
        output.value = JSON.stringify(parsed, null, 2);
        setStatus('success', 'JSON formatted successfully.');
      } catch (e) {
        setStatus('error', `Invalid JSON: ${e.message}`);
      }
    }

    function minifyJSON() {
      clearStatus();
      const raw = input.value.trim();
      if (!raw) return setStatus('error', 'Input is empty. Paste some JSON first.');
      try {
        const parsed = JSON.parse(raw);
        output.value = JSON.stringify(parsed);
        setStatus('success', 'JSON minified successfully.');
      } catch (e) {
        setStatus('error', `Invalid JSON: ${e.message}`);
      }
    }

    function validateJSON() {
      clearStatus();
      const raw = input.value.trim();
      if (!raw) return setStatus('error', 'Input is empty. Paste some JSON first.');
      try {
        const parsed = JSON.parse(raw);
        const keys = typeof parsed === 'object' && parsed !== null ? Object.keys(parsed).length : 0;
        setStatus('success', `Valid JSON. ${keys > 0 ? keys + ' top-level keys detected.' : 'Array or primitive value.'}`);
      } catch (e) {
        setStatus('error', `Invalid JSON: ${e.message}`);
      }
    }

    function copyOutput() {
      clearStatus();
      const text = output.value;
      if (!text) return setStatus('error', 'Nothing to copy. Output is empty.');
      navigator.clipboard.writeText(text).then(() => {
        setStatus('success', 'Copied to clipboard.');
      }).catch(() => {
        setStatus('error', 'Failed to copy. Try manually.');
      });
    }

    function clearAll() {
      input.value = '';
      output.value = '';
      clearStatus();
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.querySelector('.sun-icon').style.display = isDark ? 'none' : 'block';
      document.querySelector('.moon-icon').style.display = isDark ? 'block' : 'none';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.querySelector('.sun-icon').style.display = 'none';
        document.querySelector('.moon-icon').style.display = 'block';
      }
    })();
  </script>
</body>
</html>
